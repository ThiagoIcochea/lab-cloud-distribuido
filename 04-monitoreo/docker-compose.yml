# Pila de monitoreo de código abierto: Prometheus (base de datos de series temporales),
# exporters (métricas de host y sondas HTTP) y Grafana (visualización).
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [ "./prometheus.yml:/etc/prometheus/prometheus.yml:ro" ]
    command: [ "--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d" ]
    ports: [ "9090:9090" ]
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes: [ "./grafana:/etc/grafana/provisioning:ro" ]
    ports: [ "3000:3000" ]
    restart: unless-stopped

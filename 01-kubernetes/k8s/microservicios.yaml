# Tienda en microservicios: frontend (público), catalogo y pedidos (internos).
apiVersion: v1
kind: Namespace
metadata: { name: tienda }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalogo, namespace: tienda }
spec:
  replicas: 2
  selector: { matchLabels: { app: catalogo } }
  template:
    metadata: { labels: { app: catalogo } }
    spec:
      containers:
        - name: catalogo
          image: hashicorp/http-echo:0.2.3
          args: ["-text={\"servicio\":\"catalogo\",\"productos\":43}", "-listen=:8080"]
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 250m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          readinessProbe: { httpGet: { path: /, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata: { name: catalogo, namespace: tienda }
spec: { selector: { app: catalogo }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pedidos, namespace: tienda }
spec:
  replicas: 2
  selector: { matchLabels: { app: pedidos } }
  template:
    metadata: { labels: { app: pedidos } }
    spec:
      containers:
        - name: pedidos
          image: hashicorp/http-echo:0.2.3
          args: ["-text={\"servicio\":\"pedidos\",\"estado\":\"ok\"}", "-listen=:8080"]
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 250m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          readinessProbe: { httpGet: { path: /, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata: { name: pedidos, namespace: tienda }
spec: { selector: { app: pedidos }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: frontend-nginx, namespace: tienda }
data:
  default.conf: |
    server {
      listen 80;
      location /api/catalogo { proxy_pass http://catalogo.tienda.svc.cluster.local/; }
      location /api/pedidos  { proxy_pass http://pedidos.tienda.svc.cluster.local/; }
      location / { default_type text/plain; return 200 "Tienda en microservicios sobre GKE\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: tienda }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources: { requests: { cpu: 250m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          volumeMounts: [{ name: conf, mountPath: /etc/nginx/conf.d }]
          readinessProbe: { httpGet: { path: /, port: 80 } }
      volumes: [{ name: conf, configMap: { name: frontend-nginx } }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: tienda }
spec: { type: LoadBalancer, selector: { app: frontend }, ports: [{ port: 80, targetPort: 80 }] }
---
# Escalado horizontal automático según CPU (campañas de ventas).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: frontend, namespace: tienda }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: catalogo, namespace: tienda }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: catalogo }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } } }]
